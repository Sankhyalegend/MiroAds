[project]
name = "crowd-validator-backend"
version = "0.1.0"
description = "Crowd Validator API: persona library, 4-stage simulated-crowd engine, research report"
authors = [
    { name = "Sankhya K", email = "sankhya.k@tekspotglobal.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
]

# Application, not a distributable package: run with `uv run ...`, no build step.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
